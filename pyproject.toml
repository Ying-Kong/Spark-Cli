[build-system]
requires = ["setuptools>=84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-cli"
version = "2.0.0"
description = "A thin Click wrapper that turns spark-submit into one short command."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ying-Kong", email = "2931842115@qq.com" }]
keywords = ["spark", "spark-submit", "hadoop", "yarn", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["click>=8.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "pre-commit>=4.6.2",
  "pytest>=8.0",
  "pytest-cov>=7.1.0",
  "mypy>=1.10",
  "types-PyYAML",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Ying-Kong/Spark-Cli"
Issues = "https://github.com/Ying-Kong/Spark-Cli/issues"
Changelog = "https://github.com/Ying-Kong/Spark-Cli/blob/main/CHANGELOG.md"

[project.scripts]
spark-cli = "cli:cli"

[tool.setuptools]
py-modules = ["cli"]
packages = ["sparkcli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
norecursedirs = [".venv", "__pycache__", "*.egg-info", "build", "dist"]

[tool.coverage.run]
branch = true
source = ["cli", "sparkcli"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

# cli.py 里的长行与行尾空白全部位于对外输出的诊断文案中，改动会改变用户看到的文本，
# 因此该文件豁免 E501/W291；行宽规则对新增代码仍然生效。
[tool.ruff.lint.per-file-ignores]
"cli.py" = ["E501", "W291"]

[tool.mypy]
python_version = "3.10"
files = ["sparkcli"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# The Click command layer is decorated at import time, so precise signatures add
# noise without adding safety. The pure modules stay strict.
[[tool.mypy.overrides]]
module = "sparkcli.extras"
disallow_untyped_defs = false
