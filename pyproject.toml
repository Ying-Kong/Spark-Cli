[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-cli"
version = "2.0.0"
description = "A thin Click wrapper that turns spark-submit into one short command."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ying-Kong", email = "2931842115@qq.com" }]
keywords = ["spark", "spark-submit", "hadoop", "yarn", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["click>=8.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "pre-commit>=3.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Ying-Kong/Spark-Cli"
Issues = "https://github.com/Ying-Kong/Spark-Cli/issues"
Changelog = "https://github.com/Ying-Kong/Spark-Cli/blob/main/CHANGELOG.md"

[project.scripts]
spark-cli = "cli:cli"

[tool.setuptools]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
norecursedirs = [".venv", "__pycache__", "*.egg-info", "build", "dist"]

[tool.coverage.run]
branch = true
source = ["cli"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
